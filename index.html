    <style>
      #wis-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: linear-gradient(160deg, #06060d 0%, #080808 45%, #0a0a16 100%);
        overflow: hidden;
        transition: opacity 0.6s ease;
      }
      #wis-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #wis-loader .blobs::before,
      #wis-loader .blobs::after {
        content: "";
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 123, 255, 0.16) 0%, transparent 70%);
        animation: wis-pulse 3.2s ease-in-out infinite;
      }
      #wis-loader .blobs::before { top: -140px; left: -120px; }
      #wis-loader .blobs::after { bottom: -180px; right: -120px; animation-delay: 1.6s; }
      @keyframes wis-pulse {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      .wis-stage {
        position: relative;
        width: 176px;
        height: 176px;
      }
      .wis-disc {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, #12141f 0%, #0a0a12 55%, #07070d 100%);
        border: 1px solid rgba(59, 123, 255, 0.35);
        box-shadow:
          inset 0 0 28px rgba(0, 0, 0, 0.55),
          0 0 0 6px rgba(255, 255, 255, 0.02),
          0 0 32px rgba(59, 123, 255, 0.18);
      }
      .wis-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #3b7bff;
        border-right-color: rgba(59, 123, 255, 0.45);
        animation: wis-spin 1.1s linear infinite;
      }
      .wis-ring.outer { inset: -22px; border-width: 2px; border-top-color: rgba(255, 255, 255, 0.22); border-right-color: rgba(59, 123, 255, 0.35); animation-duration: 2s; animation-direction: reverse; }
      .wis-ring.dot::after {
        content: "";
        position: absolute;
        top: -6px;
        left: 50%;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        border-radius: 50%;
        background: #3b7bff;
        box-shadow: 0 0 14px 3px rgba(59, 123, 255, 0.85);
      }
      @keyframes wis-spin { to { transform: rotate(360deg); } }
      .wis-logo {
        width: 78%;
        height: 78%;
        object-fit: contain;
        animation: wis-breathe 2s ease-in-out infinite;
        filter: drop-shadow(0 0 12px rgba(59, 123, 255, 0.45));
      }
      @keyframes wis-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .wis-word {

        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: wis-shimmer 1.8s linear infinite;
      }
      @keyframes wis-shimmer { to { background-position: 200% center; } }
      .wis-bar {

        border-radius: 999px;

      }
      @keyframes wis-fill { to { width: 100%; } }

    <script>
      (function () {
        var loader = document.getElementById("wis-loader");
        var revealed = false;
        function hide() {
          if (revealed) return;
          revealed = true;
          loader.classList.add("hide");
          document.body.style.overflow = "";
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 700);
        }
        document.body.style.overflow = "hidden";
        window.addEventListener("load", hide);
        document.addEventListener("DOMContentLoaded", hide);
        var maxMs = 2200;
        var t = setTimeout(hide, maxMs);
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && document.readyState === "complete") {
            clearTimeout(t);
            hide();
          }
        });
      })();
    </script>
